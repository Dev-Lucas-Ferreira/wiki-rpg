<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Página inicial</title>
    <link rel="stylesheet" href="Teste/css/estilo.css">
</head>
<body>
    <main class="area-de-trabalho">
        <button id="atalho" class="atalho" type="button" aria-label="Abrir pasta Mapas">
            <img src="Teste/img/pasta.png" alt="" class="atalho__icone">
            <span class="atalho__nome">Mapas</span>
        </button>
    </main>

    <header class="barra-de-tarefas">
        <button class="botao-login" type="button">Login</button>
    </header>

    <audio id="musica" src="Teste/audio/dudidam-mambo.mp3" loop></audio>

    <script>
        const musica = document.getElementById("musica");
        musica.volume = 0.5; // opcional: de 0 a 1

        // Tenta tocar assim que a página carrega
        musica.play().catch(() => {
        // Se o navegador bloqueou, toca na primeira interação do usuário
        const iniciar = () => {
            musica.play();
            document.removeEventListener("click", iniciar);
            document.removeEventListener("keydown", iniciar);
            document.removeEventListener("touchstart", iniciar);
            document.removeEventListener("scroll", iniciar);
        };
        document.addEventListener("click", iniciar);
        document.addEventListener("keydown", iniciar);
        document.addEventListener("touchstart", iniciar);
        document.addEventListener("scroll", iniciar);
        });
    </script>

    
</body>
</html>
